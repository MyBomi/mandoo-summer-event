<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만두의 여름나기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Yeon+Sung&display=swap" rel="stylesheet">
<style>
  :root{
    --hbg:#0b0e09;
    --hbg-alt:#141810;
    --mold:#6f7d52;
    --mold-bright:#9ab06a;
    --water:#3f5561;
    --water-bright:#5c7986;
    --paper:#cfc79f;
    --paper-dim:#948c6c;
    --rot:#3a2a1c;
    --warn:#8a3b2a;
    --warn-bright:#b6543a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(63,85,97,.25) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 100%, rgba(111,125,82,.18) 0%, transparent 50%),
      var(--hbg);
    color:var(--paper);
    font-family:'Gowun Batang', serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.78) 100%);
    pointer-events:none; z-index:5;
  }
  body::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:6; opacity:.05;
    background: repeating-linear-gradient(0deg, #fff 0px, transparent 1px, transparent 2px, #fff 3px);
    mix-blend-mode:overlay;
  }
  #ash{position:fixed; inset:0; pointer-events:none; z-index:4; overflow:hidden;}
  .drip{
    position:absolute; top:-10px; width:2px; height:10px; border-radius:0 0 2px 2px;
    background:var(--water-bright); opacity:.5;
    animation:fall linear infinite;
  }
  @keyframes fall{
    from{ transform:translateY(0); opacity:0;}
    8%{opacity:.6;}
    to{ transform:translateY(110vh); opacity:0;}
  }

  .hidden{ display:none !important;}
  .stage{ animation: reveal .7s ease both; }
  @keyframes reveal{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* 프레임 배경을 피와 곰팡이 질감으로 교체, 진동 애니메이션 추가 */
  .frame {
    position: relative; z-index: 10;
    max-width: 640px; width: 100%;
    background: radial-gradient(circle at 50% 20%, #1a0808 0%, #0e1210 80%), #0b0e09;
    border: 1px solid rgba(138, 59, 42, 0.4);
    box-shadow: 0 0 30px rgba(138, 59, 42, 0.15), 0 30px 90px rgba(0, 0, 0, 0.85), inset 0 0 80px rgba(0, 0, 0, 0.7);
    padding: 44px 40px;
  }

  /* 괴담 분위기 붉은 자국(핏자국 느낌) 배경 오버레이 */
  .frame::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at top right, rgba(138,59,42,0.15), transparent 60%);
    pointer-events: none;
  }

  /* 제목(H1)에 피처럼 지직거리는 레드 글리치 텍스트 효과 */
  h1 {
    font-family: 'Gowun Batang', serif; font-weight: 800; font-size: clamp(24px, 4.6vw, 34px);
    line-height: 1.25; margin: 0 0 18px; color: var(--paper);
    text-shadow: 2px 0 0 rgba(138, 59, 42, 0.8), -2px 0 0 rgba(63, 85, 97, 0.5);
    animation: glitchText 3s infinite alternate;
  }

  @keyframes glitchText {
    0%, 92% { text-shadow: 2px 0 0 rgba(138, 59, 42, 0.6), -2px 0 0 rgba(63, 85, 97, 0.4); }
    94% { text-shadow: 4px 0 0 var(--warn-bright), -3px 0 0 var(--water-bright); transform: skewX(-2deg); }
    96% { text-shadow: -3px 0 0 var(--warn-bright), 3px 0 0 var(--water-bright); transform: skewX(2deg); }
    98%, 100% { text-shadow: 2px 0 0 rgba(138, 59, 42, 0.6), -2px 0 0 rgba(63, 85, 97, 0.4); }
  }

  /* 일기장 박스를 핏빛 경고문 형태로 강화 */
  .diary {
    font-family: 'Yeon Sung', cursive; font-size: 24px; color: var(--warn-bright);
    line-height: 1.6; margin: 0 0 18px; padding: 12px 16px;
    background: rgba(138, 59, 42, 0.1);
    border-left: 3px solid var(--warn-bright);
    text-shadow: 0 0 8px rgba(182, 84, 58, 0.4);
  }

  /* 경고 메시지 깜빡임 강조 */
  .warn {
    font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--warn-bright);
    min-height: 18px; margin-top: -8px; margin-bottom: 10px;
    font-weight: 700; text-shadow: 0 0 6px rgba(182, 84, 58, 0.6);
    animation: warnPulse 1.5s infinite;
  }
  .eyebrow{
    font-family:'Noto Sans KR', sans-serif; letter-spacing:.16em; text-transform:uppercase;
    font-size:12px; color:var(--water-bright); margin:0 0 10px; opacity:.85;
  }

  p{ line-height:1.8; font-size:17px; color:var(--paper-dim); margin:0 0 18px;}
  .lede{ color:var(--paper); font-size:18px;}

  .divider{ width:64px; height:2px; margin:22px 0; background:linear-gradient(90deg, var(--mold), transparent);}
  .btn{
    font-family:'Noto Sans KR', sans-serif; font-weight:700; background:transparent; color:var(--mold-bright);
    border:1px solid var(--mold); padding:13px 26px; font-size:14px; letter-spacing:.05em; cursor:pointer;
    transition:.25s;
  }
  .btn:hover{ background:var(--mold); color:#0b0e09; box-shadow:0 0 18px rgba(154,176,106,.4);}
  .btn:active{ transform:translateY(1px);}
  .team-badge{
    display:inline-block; font-family:'Noto Sans KR', sans-serif; font-size:12px; color:var(--water-bright);
    border:1px solid var(--water); padding:4px 10px; letter-spacing:.08em; margin-bottom:18px;
  }
  select, input[type=text]{
    font-family:'Noto Sans KR', sans-serif; background:#0a0d09; color:var(--paper); border:1px solid var(--mold);
    padding:12px 14px; font-size:16px; width:100%; margin:8px 0 18px;
  }
  select:focus, input:focus{ outline:none; border-color:var(--mold-bright); box-shadow:0 0 12px rgba(154,176,106,.25);}
  .row{ display:flex; gap:10px; align-items:center;}
  .stage-num{ font-family:'Noto Sans KR', sans-serif; font-size:13px; color:var(--water-bright); letter-spacing:.12em;}
  footer{ margin-top:26px; font-family:'Noto Sans KR', sans-serif; font-size:11px; color:rgba(207,199,159,.35); text-align:center;}

  /* ============================================================
     ACT 1 — 단계1: 젖은 문 찾기
     ============================================================ */
  .door-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:20px 0 8px;}
  .door{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:34px; background:rgba(0,0,0,.35); border:1px solid rgba(111,125,82,.22);
    cursor:pointer; transition:.2s; user-select:none;
  }
  .door:hover{ border-color:var(--mold); background:rgba(111,125,82,.08);}
  .door.wet{ filter:hue-rotate(150deg) saturate(1.3); animation:seep 2.4s infinite ease-in-out;}
  @keyframes seep{ 0%,100%{opacity:1;} 45%{opacity:.6;} 60%{opacity:1;} }
  .shake{ animation:shake .4s;}
  @keyframes shake{ 20%,60%{transform:translateX(-6px);} 40%,80%{transform:translateX(6px);} }

  /* ============================================================
     ACT 1 — 단계3: 상징 순서 맞추기
     ============================================================ */
  .symbol-row{ display:flex; gap:12px; justify-content:center; margin:22px 0 6px; flex-wrap:wrap;}
  .symbol{
    font-size:36px; width:64px; height:64px; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(111,125,82,.22); background:rgba(0,0,0,.35); cursor:pointer; transition:.2s;
  }
  .symbol:hover{ border-color:var(--mold);}
  .symbol.picked{ border-color:var(--water-bright); background:rgba(63,85,97,.25);}
  .pips{ display:flex; gap:6px; justify-content:center; margin:14px 0 4px;}
  .pip{ width:9px; height:9px; border:1px solid var(--mold); background:transparent;}
  .pip.on{ background:var(--mold-bright); box-shadow:0 0 8px var(--mold-bright);}

  /* ============================================================
     ACT 0 — 디스코드 인트로
     (가벼운 잡담으로 시작 → 낯선 사용자 등장 → 점점 음산해짐)
     ============================================================ */
  #act0{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, #dfe7ef 0%, #c7d3e0 100%);
    padding:24px;
  }
  .discord{
    width:100%; max-width:480px; height:min(680px,86vh); background:#313338; border-radius:12px;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.4);
    transition: filter 1.4s ease, box-shadow 1.4s ease;
  }
  /* 낯선 사용자가 처음 등장하면 살짝 가라앉는 톤 */
  .discord.tension-1{ filter: saturate(.85) brightness(.96); }
  /* 소름 돋는 대사(우물 등) 이후: 채도/명도를 더 낮추고 붉은 그림자를 얹음 */
  .discord.tension-2{
    filter: saturate(.55) brightness(.82) contrast(1.05);
    box-shadow:0 30px 90px rgba(140,20,10,.28);
  }
  .discord-head{
    background:#2b2d31; border-bottom:1px solid #26272b; padding:14px 18px;
    font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:15px; color:#f2f3f5;
    display:flex; align-items:center; gap:8px;
  }
  .discord-head .hash{ color:#80848e; font-weight:700;}
  .discord-body{ flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column;}
  .msg-row{ display:flex; gap:14px; padding:5px 0;}
  .msg-row.compact{ padding-top:0;}
  .avatar{
    width:38px; height:38px; min-width:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:14px; color:#fff; margin-top:2px;
  }
  .avatar.ghost{ background:#3f4147 !important; color:#80848e; font-size:16px;}
  .msg-row.compact .avatar{ visibility:hidden; height:0; min-height:0;}
  .msg-col{ flex:1; min-width:0;}
  .msg-meta{ display:flex; align-items:baseline; gap:8px; margin-bottom:2px;}
  .msg-name{ font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:15px;}
  .msg-name.ghost{ color:#80848e;}
  .msg-time{ font-family:'Noto Sans KR', sans-serif; font-size:11px; color:#80848e;}
  .msg-text{
    font-family:'Noto Sans KR', sans-serif; font-size:15px; line-height:1.45; color:#dbdee1;
    opacity:0; transform:translateY(4px); animation:pop .3s forwards;
  }
  .msg-text.ghost{ color:#96999f; font-style:italic;}
  /* 가장 소름 돋는 대사에 붙이는 미세한 깜빡임(글리치) 효과 */
  .msg-text.ghost.dread{ animation: pop .3s forwards, flicker 2.6s 1s ease-in-out infinite; }
  @keyframes flicker{ 0%,100%{opacity:1;} 92%{opacity:1;} 94%{opacity:.35;} 96%{opacity:.9;} }
  .avatar.ghost.dread{ box-shadow:0 0 12px rgba(182,84,58,.55); }
  @keyframes pop{ to{opacity:1; transform:translateY(0);} }
  .discord-foot{ padding:14px 18px 18px;}
  .discord-input{
    background:#383a40; border-radius:8px; padding:11px 16px; font-family:'Noto Sans KR', sans-serif;
    font-size:14px; color:#6d6f78; cursor:default; transition:.25s;
  }
  .discord-input.ready{ background:#5865f2; color:#fff; cursor:pointer; text-align:center; font-weight:700;}
  .discord-input.ready:hover{ background:#4752c4;}
  /* "...(입력 중)" 표시 — 답 없이 사라지며 정적을 만드는 연출용 */
  .msg-row.typing .msg-text{ display:flex; gap:4px; align-items:center; height:20px; opacity:1; animation:none;}
  .typing-dot{ width:6px; height:6px; border-radius:50%; background:#80848e; animation:blink 1.2s infinite ease-in-out;}
  .typing-dot:nth-child(2){ animation-delay:.2s;}
  .typing-dot:nth-child(3){ animation-delay:.4s;}
  @keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  /* ============================================================
     TRANSITION — ACT 0 → ACT 1 (편지 도착 장면)
     ============================================================ */
  #act0-transition{
    position:fixed; inset:0; z-index:60; background:#000; display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; padding:24px; overflow:hidden;
  }
  #act0-transition::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(138,59,42,.18) 100%);
    opacity:0; animation:vign 4s ease forwards;
  }
  @keyframes vign{ 0%,50%{opacity:0;} 100%{opacity:1;} }
  #act0-transition p{
    font-family:'Gowun Batang', serif; font-size:20px; color:var(--paper); opacity:0;
    animation:tfade .8s forwards; position:relative; z-index:1;
  }
  #act0-transition p:nth-child(2){ animation-delay:1.6s; color:var(--warn-bright);}
  #act0-transition p:nth-child(3){ animation-delay:2.9s; color:var(--paper-dim); font-size:16px;}
  @keyframes tfade{ from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>

<div id="ash"></div>

<!-- ============================================================
     ACT 0 — 디스코드 인트로 (밝은 잡담 → 낯선 사용자 → 음산함)
     ============================================================ -->
<div id="act0">
  <div class="discord">
    <div class="discord-head"><span class="hash">#</span>부대챗</div>
    <div class="discord-body" id="chat-body"></div>
    <div class="discord-foot"><div class="discord-input" id="act0-next">메시지 보내기...</div></div>
  </div>
</div>

<!-- ============================================================
     TRANSITION — ACT 0 → ACT 1 (편지 도착)
     ============================================================ -->
<div id="act0-transition" class="hidden">
  <p>그리고 며칠 후,</p>
  <p>출처를 알 수 없는 편지 한 통이 도착했다.</p>
</div>

<div class="frame">

  <!-- ============================================================
       ACT 1 — 서막: 정체불명의 편지
       ============================================================ -->   
  <section id="stage-0" class="stage hidden">
    <p class="team-badge" id="team-badge-0"></p>
    <p class="eyebrow">ACT 1</p>
    <h1>정체불명의 편지</h1>
    <p class="lede">기괴하게 오려 붙인 글자들, 당신의 일상을 모두 지켜본 듯한 문장들. 편지를 살피던 중, 라벤더 향과 함께 옅은 좌표가 찍혀 있는 걸 발견했다.</p>
    <!-- 좌표는 헤피@모그리의 하우징 주소를 가리키도록 한다 -->
    <!-- <p>불안을 안고 좌표가 가리키는 낡은 집 앞에 도착한 당신. 그런데 그곳엔 이미 익숙한 사람들이 모여 있었다 — 모두 같은 편지를 받고 모인 만두들이었다.</p> -->
    <!-- <p class="diary">"너도 이 편지를 받고 왔어?"</p> -->
    <div class="divider"></div>
    <button class="btn" id="start-btn">봉투를 연다</button>
  </section>

  
  <!-- ============================================================
       팀 선택 (팀 미지정 상태로 접속했을 때만 표시)
       ============================================================ -->
  <section id="stage-noteam" class="stage hidden">
    <p class="eyebrow">입장</p>
    <h1>당신의 팀을 선택하라</h1>
    <p>초대장에 적힌 팀 이름을 골라라. 그 팀의 운명이 당신의 손에 달려 있다.</p>
    <select id="team-select">
      <option value="">— 팀 선택 —</option>
    </select>
    <button class="btn" id="team-confirm">입장한다</button>
  </section> 

  <footer>만두의 여름나기</footer>
</div>

<script type="module">
/* ================= 설정 (여기만 고치면 됨) ================= */
const CONFIG = {
  teams: ['고래','상어','참치','문어','오리'],
  chatIntro: [
    { name:'헤피', text:'이번 여름 이벤트는 어디서 모일까요?', time:'오후 4:51' },
    { name:'새봄', text:'검은장막 숲 계곡물이 차갑다던데 어때요?', time:'오후 4:52' },
    { name:'만두(나)', text:'좋아요! 드레스 코드는 어떻게 될까요?', time:'오후 4:52' },
    { name:'알 수 없는 사용자', text:'저도 가도 되나요', eerie:true, time:'오후 4:53' },
    { name:'새봄', text:'ㅋㅋㅋ누구시지? 헤피가 장난치나', time:'오후 4:54' },
    { name:'헤피', text:'아닌데;; 나 아님', time:'오후 4:54' },
    { name:'알 수 없는 사용자', text:'곧 만나요', eerie:true, time:'오후 4:55' },
  ]
};
/* ============================================================ */

const $ = (id) => document.getElementById(id);

/* ============================================================
   ACT 0 — 디스코드 인트로 로직
   ============================================================ */
const AVATAR_COLORS = ['#5865f2','#57f287','#eb459e','#faa61a','#ed4245'];
function colorFor(name){
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[h];
}
const chatBody = $('chat-body');
let ci = 0;
let lastName = null;
function playChat(){
  if (ci >= CONFIG.chatIntro.length){
    const btn = $('act0-next');
    btn.textContent = '계속하기';
    btn.classList.add('ready');
    btn.onclick = () => {
      $('act0').classList.add('hidden');
      $('act0-transition').classList.remove('hidden');
      setTimeout(afterTransition, 6000);
    };
    return;
  }
  const m = CONFIG.chatIntro[ci];
  const compact = (m.name === lastName);
  const row = document.createElement('div');
  row.className = 'msg-row' + (compact ? ' compact' : '');

  const avatar = document.createElement('div');
  avatar.className = 'avatar' + (m.eerie ? ' ghost' : '');
  avatar.style.background = m.eerie ? '' : colorFor(m.name);
  avatar.textContent = m.eerie ? '?' : m.name.slice(0,1);
  row.appendChild(avatar);

  const col = document.createElement('div');
  col.className = 'msg-col';
  if (!compact){
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const nameEl = document.createElement('span');
    nameEl.className = 'msg-name' + (m.eerie ? ' ghost' : '');
    nameEl.style.color = m.eerie ? '' : colorFor(m.name);
    nameEl.textContent = m.name;
    const timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = m.time || '';
    meta.appendChild(nameEl); meta.appendChild(timeEl);
    col.appendChild(meta);
  }
  const textEl = document.createElement('div');
  textEl.className = 'msg-text' + (m.eerie ? ' ghost' : '');
  textEl.textContent = m.text;
  col.appendChild(textEl);
  row.appendChild(col);

  chatBody.appendChild(row);
  chatBody.scrollTop = chatBody.scrollHeight;
  lastName = m.name;
  ci++;
  setTimeout(playChat, m.eerie ? 1400 : 800);
}
playChat();

/* ============================================================
   TRANSITION 로직 — ACT 0 종료 후 팀 배정에 따라 분기
   ============================================================ */
function afterTransition(){
  $('act0-transition').classList.add('hidden');
  if (team) { $('team-badge-0').textContent = team + '팀'; show('stage-0'); reportProgress(team, 0); }
  else { show('stage-noteam'); }
}

/* ---- Team resolution ---- */
const params = new URLSearchParams(location.search);
let team = (params.get('team') || '').toUpperCase();
if (!CONFIG.teams.includes(team)) team = null;

function show(id){ document.querySelectorAll('.stage').forEach(s=>s.classList.add('hidden')); $(id).classList.remove('hidden'); }

const sel = $('team-select');
CONFIG.teams.forEach(t=>{
  const opt = document.createElement('option');
  opt.value = t; opt.textContent = t + '팀';
  sel.appendChild(opt);
});

$('team-confirm').onclick = () => {
  if (!sel.value) return;
  
  // 1. 선택한 팀 설정
  team = sel.value;
  
  // 2. URL 파라미터만 살짝 변경 (페이지 새로고침 X)
  const url = new URL(location.href);
  url.searchParams.set('team', team);
  history.pushState({}, '', url.toString());

  // 3. 뱃지 업데이트 후 ACT 1(stage-0)으로 바로 이동
  $('team-badge-0').textContent = team + '팀';
  show('stage-0');
  reportProgress(team, 0);
};

$('start-btn').onclick = () => { show('stage-1'); initStage1(); reportProgress(team, 1); };

</script>
</body>
</html>
