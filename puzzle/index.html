  <button id="bgm-toggle" aria-label="배경음악 켜기/끄기" title="배경음악 켜기/끄기"
    style="position:fixed; right:16px; bottom:16px; z-index:999; width:44px; height:44px;
          border-radius:50%; border:none; background:rgba(20,20,30,0.75); color:#fff;
          font-size:20px; line-height:44px; text-align:center; cursor:pointer; padding:0;">🔈</button>

<script>
(function () {
  var audio = document.getElementById('bgm');
  var btn = document.getElementById('bgm-toggle');
  var userPaused = false;

  audio.volume = 0.10; // 볼륨 50% (0.0 ~ 1.0 사이로 조절 가능)

  // 아이콘은 "내가 껐다/켰다" 여부가 아니라 실제 audio 상태를 그대로 따라가게 함
  audio.addEventListener('play',  function () { btn.textContent = '🔈'; });
  audio.addEventListener('pause', function () { btn.textContent = '🔇'; });

  // 파일을 못 찾거나 재생 자체가 실패하면 콘솔에 원인을 남기고 버튼에 표시
  audio.addEventListener('error', function () {
    var code = audio.error ? audio.error.code : '?';
    console.error('[BGM] 로드/재생 실패 (code ' + code + '). src="' + audio.currentSrc + '" 경로와 파일이 실제로 있는지 확인하세요.');
    btn.textContent = '⚠️';
    btn.title = 'BGM 파일을 재생할 수 없습니다 (콘솔 확인)';
  });

  function armResumeOnInteraction() {
    var resume = function () {
      if (!userPaused) {
        audio.play().catch(function (err) { console.error('[BGM] play() 실패:', err); });
      }
      window.removeEventListener('pointerdown', resume);
      window.removeEventListener('keydown', resume);
    };
    window.addEventListener('pointerdown', resume, { once: true });
    window.addEventListener('keydown', resume, { once: true });
  }

  function tryPlay() {
    var p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function (err) {
        // 자동재생이 막힌 경우(NotAllowedError): 첫 사용자 입력 시 재생
        console.warn('[BGM] 자동재생이 막혔습니다. 화면을 한 번 클릭/터치하면 재생됩니다.', err);
        armResumeOnInteraction();
      });
    }
  }

  btn.addEventListener('click', function () {
    if (audio.paused) {
      userPaused = false;
      audio.play().catch(function (err) { console.error('[BGM] play() 실패:', err); });
    } else {
      userPaused = true;
      audio.pause();
    }
  });

  tryPlay();
})();
</script>

  <script src="../assets/answer.js"></script>
  <script>
    /* ===== 3x3 슬라이드 퍼즐 (숫자 타일 버전, 이미지 있으면 CSS로 교체 가능) ===== */
    const SIZE = 3;
    const board = document.getElementById("puzzle-board");
    const statusEl = document.getElementById("puzzle-status");
    let tiles = [];       // 현재 배치된 값 (0 = 빈칸)
    let solved = false;

    // 이미지를 쓰고 싶다면: 아래 TILE_IMAGE에 경로를 넣고,
    // .puzzle-tile 스타일이 자동으로 배경을 분할해서 보여줍니다.
    const TILE_IMAGE = "../assets/img/puzzle-npc.png";

    function createSolvedArray() {
      const arr = [];
      for (let i = 1; i < SIZE * SIZE; i++) arr.push(i);
      arr.push(0);
      return arr;
    }

    function isSolvable(arr) {
      const flat = arr.filter((v) => v !== 0);
      let inversions = 0;
      for (let i = 0; i < flat.length; i++) {
        for (let j = i + 1; j < flat.length; j++) {
          if (flat[i] > flat[j]) inversions++;
        }
      }
      const emptyRowFromBottom = SIZE - Math.floor(arr.indexOf(0) / SIZE);
      if (SIZE % 2 === 0) {
        return (inversions + emptyRowFromBottom) % 2 === 1;
      }
      return inversions % 2 === 0;
    }

    function shuffle() {
      let arr;
      do {
        arr = createSolvedArray();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      } while (!isSolvable(arr) || isSolved(arr));
      tiles = arr;
      solved = false;
      render();
      statusEl.textContent = "조각을 클릭해서 빈 칸으로 이동시키세요.";
    }

    function isSolved(arr) {
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] !== i + 1) return false;
      }
      return arr[arr.length - 1] === 0;
    }

    function render() {
      board.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
      board.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;
      board.innerHTML = "";
      tiles.forEach((val, idx) => {
        const cell = document.createElement("div");
        if (val === 0) {
          cell.className = "puzzle-tile empty";
        } else {
          cell.className = "puzzle-tile";
          cell.textContent = val;
          if (TILE_IMAGE) {
            const originalIdx = val - 1;
            const col = originalIdx % SIZE;
            const row = Math.floor(originalIdx / SIZE);
            cell.style.setProperty("--tile-img", `url(${TILE_IMAGE})`);
            cell.style.setProperty("--tile-bg-size", `${SIZE * 100}%`);
            cell.style.setProperty("--bx", `${(col / (SIZE - 1)) * 100}%`);
            cell.style.setProperty("--by", `${(row / (SIZE - 1)) * 100}%`);
            cell.textContent = "";
          }
          cell.addEventListener("click", () => tryMove(idx));
        }
        board.appendChild(cell);
      });
    }

    function tryMove(idx) {
      if (solved) return;
      const emptyIdx = tiles.indexOf(0);
      const idxRow = Math.floor(idx / SIZE), idxCol = idx % SIZE;
      const emptyRow = Math.floor(emptyIdx / SIZE), emptyCol = emptyIdx % SIZE;
      const adjacent =
        (idxRow === emptyRow && Math.abs(idxCol - emptyCol) === 1) ||
        (idxCol === emptyCol && Math.abs(idxRow - emptyRow) === 1);
      if (!adjacent) return;

      [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
      render();

      //if (true) {
      if (isSolved(tiles)) {
        solved = true;
        statusEl.textContent = "안개가 걷히고 있다...";
        setTimeout(() => {
          document.getElementById("npc-reveal").classList.add("show");
          document.getElementById("npc-reveal").scrollIntoView({ behavior: "smooth", block: "center" });
        }, 500);
      }
    }

    document.getElementById("shuffle-btn").addEventListener("click", shuffle);
    shuffle();

    document.getElementById("npc-figure").addEventListener("click", function () {
      this.style.pointerEvents = "none";
      this.style.filter = "brightness(1.4)";
      const section = document.getElementById("answer-section");
      section.style.display = "block";
      section.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    initAnswerForm({
      formId: "quiz4-form",
      inputId: "quiz4-input",
      errorId: "quiz4-error",
      answers: ["구해줘"],
      nextUrl: "../help/",
      failUrl: "../fail/"
    });
  </script>
