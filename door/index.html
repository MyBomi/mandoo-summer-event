<!DOCTYPE html>
<html lang="ko">
<head>
<style>
:root { --mandoo-portrait: url(../assets/img/mandoo-img.png); }

.glitch-wrap {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #05070c;
}

.glitch-wrap .glitch-base {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  animation: glitch-jitter 6s infinite steps(1, end);
}

.glitch-wrap .glitch-slice {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-image: var(--mandoo-portrait);
  background-size: cover;
  background-position: center;
  mix-blend-mode: screen;
  opacity: 0;
  pointer-events: none;
}
.glitch-wrap .glitch-slice.r {
  filter: sepia(1) saturate(8) hue-rotate(-50deg) brightness(1.1);
  animation: glitch-slice-r 6s infinite steps(1, end);
}
.glitch-wrap .glitch-slice.b {
  filter: sepia(1) saturate(8) hue-rotate(155deg) brightness(1.1);
  animation: glitch-slice-b 6s infinite steps(1, end);
}

.glitch-wrap .glitch-static {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay;
  opacity: 0;
  pointer-events: none;
  animation: glitch-static 6s infinite steps(1, end);
}

.glitch-wrap .glitch-scan {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
  mix-blend-mode: multiply;
  opacity: 0.12;
  pointer-events: none;
}

.glitch-wrap .glitch-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
}

@keyframes glitch-jitter {
  0%, 100% { transform: translate(0, 0) scale(1); filter: none; }
  46%      { transform: translate(0, 0); }
  47%      { transform: translate(-6px, 2px) scale(1.01); filter: contrast(1.3) brightness(0.85); }
  48%      { transform: translate(4px, -2px); }
  49%      { transform: translate(0, 0) scale(1); filter: none; }
  87%      { transform: translate(0, 0); }
  88%      { transform: translate(5px, 0) skewX(2deg); filter: contrast(1.4) brightness(0.8); }
  90%      { transform: translate(0, 0) scale(1); filter: none; }
}
@keyframes glitch-slice-r {
  0%, 100% { opacity: 0; clip-path: inset(0 0 0 0); transform: translateX(0); }
  46%      { opacity: 0; }
  47%      { opacity: 0.7; clip-path: inset(20% 0 55% 0); transform: translateX(-6px); }
  48%      { opacity: 0.5; clip-path: inset(60% 0 10% 0); transform: translateX(4px); }
  49%      { opacity: 0; }
  87%      { opacity: 0; }
  88%      { opacity: 0.6; clip-path: inset(10% 0 70% 0); transform: translateX(5px); }
  90%      { opacity: 0; }
}
@keyframes glitch-slice-b {
  0%, 100% { opacity: 0; clip-path: inset(0 0 0 0); transform: translateX(0); }
  46%      { opacity: 0; }
  47%      { opacity: 0.6; clip-path: inset(55% 0 15% 0); transform: translateX(6px); }
  48%      { opacity: 0.4; clip-path: inset(5% 0 65% 0); transform: translateX(-4px); }
  49%      { opacity: 0; }
  87%      { opacity: 0; }
  88%      { opacity: 0.5; clip-path: inset(65% 0 5% 0); transform: translateX(-5px); }
  90%      { opacity: 0; }
}
@keyframes glitch-static {
  0%, 100% { opacity: 0; }
  47%      { opacity: 0.5; }
  49%      { opacity: 0; }
  88%      { opacity: 0.4; }
  90%      { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .glitch-wrap .glitch-base,
  .glitch-wrap .glitch-slice,
  .glitch-wrap .glitch-static {
    animation: none !important;
  }
}
</style>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>만두의 여름 휴가 3</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <main class="stage">
    <span class="chapter-tag">CHAPTER 3</span>
    <!-- <h1 class="title">현관문 아래, 편지 한 통</h1> -->

    <p class="story">편지를 주워 밖으로 나오자, 누군가 기다렸다는 듯 내 손에 티켓 한장을 쥐여주고 떠났다.<br>울다하 은행의 직인이 선명하게 찍힌 100억 길 교환권.<br><br>'뭐야, 이거 진짜인가?'<br><br>티켓을 주머니에 넣은 나는 폐가에서 들고나온 편지를 열어보았다.<br>편지를 남긴 이의 이름은 <strong>'최만두'</strong>. 이름 아래 적힌 링크셸을 통해 대화를 시도해보았다.</p>

    <div class="art-slot" style="min-height:0; aspect-ratio: 800 / 500; max-width: 600px; margin-left:auto; margin-right:auto; position:relative; overflow:hidden;">
      <div class="glitch-wrap">
        <img src="../assets/img/mandoo-img.png" alt="최만두의 프로필" class="glitch-base">
        <div class="glitch-slice r"></div>
        <div class="glitch-slice b"></div>
        <div class="glitch-static"></div>
        <div class="glitch-scan"></div>
        <div class="glitch-vignette"></div>
      </div>
    </div>

    <div class="chat-log" id="chat-log"></div>

    <div id="chat-continue" style="display:none; text-align:center; margin-top:8px;">
      <button id="continue-btn" class="btn-block">다음 이야기로</button>
    </div>
  </main>

  <p class="brand-footer">만두의 여름 휴가 · 모그리 따끈따끈 <<만두>></p>

  <audio id="typing-sfx" src="../assets/sound/typing.mp3" preload="auto"></audio>

  <script>
    // 채팅 메시지 순차 출력 연출
    const messages = [
      { who: "them", name: "최만두", text: "방금 거기서 나오셨죠?" },
      { who: "me", name: "나", text: "......네." },
      { who: "them", name: "최만두", text: "다른 게 아니라, 제 친구들 좀 구해주세요!" },
      { who: "me", name: "나", text: "......네?" },
      { who: "them", name: "최만두", text: "며칠 전에 폐가 체험을 하고 나서, 같이 갔던 두 녀석이 사라졌어요. 흔적도 없이 감쪽같이요." },
      { who: "them", name: "최만두", text: "정말 이상해서 그 뒤로 계속 여기로 들어가는 사람들을 지켜보고 있었어요. 그러다 당신이 나타난 거죠!" },
      { who: "them", name: "최만두", text: "분명 그날 밤, 저희 셋 다 무사히 빠져나왔다고 생각했는데 도대체 어떻게 된 일인지 영문을 모르겠어요." },
      { who: "them", name: "최만두", text: "아무도 그 애들을 기억하지 못한다는 게 말이 되나요? 훈련생들도, 가족들도 전부 잊었다니까요?" },
      { who: "choice", options: [
        "폐가에 들어간 게 문제라면 당신도 함께 사라지거나, 그들을 잊어야 했을 텐데요. 왜 당신만 멀쩡한 거죠?",
        "셋이 다 같이 있었을 텐데 당신만 무사하다는 게 이상하네요. 혹시 행동이 달랐던 부분이 있어요?"
      ] },
      { who: "them", name: "최만두", text: "한 가지 다른 점이 있긴 했어요. 애들은 지하까지 내려갔었고, 저는 무서운 걸 싫어해서 1층에만 있었거든요." },
      { who: "them", name: "최만두", text: "그래도 걔네 금방 올라왔어요. 진짜 별 일 없었다고요." },
      { who: "them", name: "최만두", text: "아, 근데 평소보다 표정이 좀 어두웠던 것 같기도 해요." },
      { who: "them", name: "최만두", text: "이런 거 하고 나면 재밌다고 귀가 아프게 떠들던 애들인데, 어땠냐고 물어봐도 통 대답을 안하더라고요." },
      { who: "them", name: "최만두", text: "그때부터가 시작이었던 걸까요?" },
      { who: "choice", options: [
        "당시의 상황 말고 따로 짚이는 데는 없나요?",
        "그것 말고 뭔가 챙겨온 물건이나 이상한 점은 없었어요?"
      ] },
      { who: "them", name: "최만두", text: "아이고야. 내 정신 좀 봐!" },
      { who: "them", name: "최만두", text: "이건 애들을 찾으러 다시 폐가에 들어갔을 때, 지하로 통하던 계단에서 주운 거예요." },
      { who: "them", name: "최만두", text: "더 아래까지는 차마 못 내려갔지만....... 단서가 될 수 있을까요?" },
    ];

    const log = document.getElementById("chat-log");
    const typingSfx = document.getElementById("typing-sfx");
    typingSfx.volume = 0.3;
    let typingSfxTimer = null;
    let sfxArmed = false;
    let i = 0;

    // 매번 같은 0~2초 구간만 들리면 지루하니, 0~4초 사이 임의 지점부터 재생한다.
    function seekTypingSfxRandom() {
      const dur = isFinite(typingSfx.duration) && typingSfx.duration > 0 ? typingSfx.duration : 4;
      const maxStart = Math.min(4, Math.max(0, dur - 0.3));
      typingSfx.currentTime = Math.random() * maxStart;
    }

    // 페이지 로드 직후(첫 메시지)는 브라우저 자동재생 정책 때문에
    // play()가 막힐 수 있어, 첫 상호작용 시 놓친 타자음을 다시 재생한다.
    function armSfxUnlock() {
      if (sfxArmed) return;
      sfxArmed = true;
      const unlock = () => {
        sfxArmed = false;
        seekTypingSfxRandom();
        typingSfx.play().catch(() => {});
        window.removeEventListener("pointerdown", unlock);
        window.removeEventListener("keydown", unlock);
      };
      window.addEventListener("pointerdown", unlock, { once: true });
      window.addEventListener("keydown", unlock, { once: true });
    }

    function playTypingSfx() {
      seekTypingSfxRandom();
      const playPromise = typingSfx.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch((err) => {
          console.warn("[typing] 자동재생이 막혔습니다. 화면을 클릭/터치하면 재생됩니다.", err);
          armSfxUnlock();
        });
      }
      clearTimeout(typingSfxTimer);
      typingSfxTimer = setTimeout(() => typingSfx.pause(), 2000);
    }

    function appendMeBubble(text) {
      const bubble = document.createElement("div");
      bubble.className = "chat-bubble me";
      bubble.innerHTML = `<span class="chat-name">나</span>${text}`;
      log.appendChild(bubble);
      playTypingSfx();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function showChoices(options) {
      const wrap = document.createElement("div");
      wrap.className = "chat-choices";
      options.forEach((text) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chat-choice-btn";
        btn.textContent = text;
        btn.addEventListener("click", () => {
          wrap.remove();
          appendMeBubble(text);
          setTimeout(showNext, 3000);
        });
        wrap.appendChild(btn);
      });
      log.appendChild(wrap);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function showNext() {
      if (i >= messages.length) {
        document.getElementById("chat-continue").style.display = "block";
        return;
      }
      const m = messages[i++];
      if (m.who === "choice") {
        showChoices(m.options);
        return;
      }
      const bubble = document.createElement("div");
      bubble.className = "chat-bubble " + (m.who === "me" ? "me" : "them");
      bubble.innerHTML = `<span class="chat-name">${m.name}</span>${m.text}`;
      log.appendChild(bubble);
      playTypingSfx();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      setTimeout(showNext, 3000);
    }

    setTimeout(showNext, 10000);

    document.getElementById("continue-btn").addEventListener("click", () => {
      window.location.href = "../puzzle/";
    });
  </script>

  <script src="../assets/timer.js"></script>
</body>
</html>
