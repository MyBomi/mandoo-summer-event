<!DOCTYPE html>
<html lang="ko">
<head>
<style>
:root { --mandoo-portrait: url(../assets/img/mandoo-img.png); }

.glitch-wrap {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #05070c;
}

.glitch-wrap .glitch-base {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  animation: glitch-jitter 6s infinite steps(1, end);
}

.glitch-wrap .glitch-slice {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-image: var(--mandoo-portrait);
  background-size: cover;
  background-position: center;
  mix-blend-mode: screen;
  opacity: 0;
  pointer-events: none;
}
.glitch-wrap .glitch-slice.r {
  filter: sepia(1) saturate(8) hue-rotate(-50deg) brightness(1.1);
  animation: glitch-slice-r 6s infinite steps(1, end);
}
.glitch-wrap .glitch-slice.b {
  filter: sepia(1) saturate(8) hue-rotate(155deg) brightness(1.1);
  animation: glitch-slice-b 6s infinite steps(1, end);
}

.glitch-wrap .glitch-static {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay;
  opacity: 0;
  pointer-events: none;
  animation: glitch-static 6s infinite steps(1, end);
}

.glitch-wrap .glitch-scan {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
  mix-blend-mode: multiply;
  opacity: 0.12;
  pointer-events: none;
}

.glitch-wrap .glitch-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
}

@keyframes glitch-jitter {
  0%, 100% { transform: translate(0, 0) scale(1); filter: none; }
  46%      { transform: translate(0, 0); }
  47%      { transform: translate(-6px, 2px) scale(1.01); filter: contrast(1.3) brightness(0.85); }
  48%      { transform: translate(4px, -2px); }
  49%      { transform: translate(0, 0) scale(1); filter: none; }
  87%      { transform: translate(0, 0); }
  88%      { transform: translate(5px, 0) skewX(2deg); filter: contrast(1.4) brightness(0.8); }
  90%      { transform: translate(0, 0) scale(1); filter: none; }
}
@keyframes glitch-slice-r {
  0%, 100% { opacity: 0; clip-path: inset(0 0 0 0); transform: translateX(0); }
  46%      { opacity: 0; }
  47%      { opacity: 0.7; clip-path: inset(20% 0 55% 0); transform: translateX(-6px); }
  48%      { opacity: 0.5; clip-path: inset(60% 0 10% 0); transform: translateX(4px); }
  49%      { opacity: 0; }
  87%      { opacity: 0; }
  88%      { opacity: 0.6; clip-path: inset(10% 0 70% 0); transform: translateX(5px); }
  90%      { opacity: 0; }
}
@keyframes glitch-slice-b {
  0%, 100% { opacity: 0; clip-path: inset(0 0 0 0); transform: translateX(0); }
  46%      { opacity: 0; }
  47%      { opacity: 0.6; clip-path: inset(55% 0 15% 0); transform: translateX(6px); }
  48%      { opacity: 0.4; clip-path: inset(5% 0 65% 0); transform: translateX(-4px); }
  49%      { opacity: 0; }
  87%      { opacity: 0; }
  88%      { opacity: 0.5; clip-path: inset(65% 0 5% 0); transform: translateX(-5px); }
  90%      { opacity: 0; }
}
@keyframes glitch-static {
  0%, 100% { opacity: 0; }
  47%      { opacity: 0.5; }
  49%      { opacity: 0; }
  88%      { opacity: 0.4; }
  90%      { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .glitch-wrap .glitch-base,
  .glitch-wrap .glitch-slice,
  .glitch-wrap .glitch-static {
    animation: none !important;
  }
}
</style>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>만두의 여름 휴가 3</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <main class="stage">
    <span class="chapter-tag">CHAPTER 3</span>
    <!-- <h1 class="title">현관문 아래, 편지 한 통</h1> -->

    <p class="story">편지를 남긴 이는 <strong>'최만두'</strong>. 편지에 적힌 연락처로 조심스레 말을 걸어보았다.</p>

    <div class="art-slot" style="min-height:0; aspect-ratio: 800 / 500; max-width: 600px; margin-left:auto; margin-right:auto; position:relative; overflow:hidden;">
      <div class="glitch-wrap">
        <img src="../assets/img/mandoo-img.png" alt="최만두의 프로필" class="glitch-base">
        <div class="glitch-slice r"></div>
        <div class="glitch-slice b"></div>
        <div class="glitch-static"></div>
        <div class="glitch-scan"></div>
        <div class="glitch-vignette"></div>
      </div>
    </div>

    <div class="chat-log" id="chat-log"></div>

    <div id="chat-continue" style="display:none; text-align:center; margin-top:8px;">
      <button id="continue-btn" class="btn-block">다음 이야기로</button>
    </div>
  </main>

  <p class="brand-footer">만두의 여름 휴가 · 모그리 따끈따끈 <<만두>></p>

  <script>
    // 채팅 메시지 순차 출력 연출
    const messages = [
      { who: "them", name: "최만두", text: "제 친구들 좀 구해 주세요… 며칠 전 폐가 체험을 하러 갔었는데, 저희 셋 다 무사히 탈출했었어요." },
      { who: "them", name: "최만두", text: "근데 그 뒤로 이상한 일이 벌어졌어요. 두 친구가 감쪽같이 사라졌어요." },
      { who: "them", name: "최만두", text: "더 이상한 건, 아무도 그들을 기억하지 못한다는 거예요. 훈련생들도, 가족들마저도요." },
      { who: "me", name: "나", text: "폐가에 들어갔기 때문이라면 당신도 잊혀야 했을 텐데… 왜 당신만 멀쩡한 거죠?" },
      { who: "them", name: "최만두", text: "한 가지 짚이는 데가 있긴 해요. 애들은 지하에 내려갔었고, 저는 무서운 걸 싫어해서 1층에만 있었거든요." },
      { who: "them", name: "최만두", text: "그래도 걔네 금방 올라왔어요. 진짜 별일 없었다고요. 아, 근데 평소보다 표정이 좀 어두웠던 것 같기도 해요." },
      { who: "them", name: "최만두", text: "이런 거 하고 나면 재밌다고 펄쩍펄쩍 뛰던 애들인데, 어땠냐고 물어봐도 대답을 안 하더라고요. 혹시 그때부터 문제였던 걸까요?" },
      { who: "them", name: "최만두", text: "이건 애들을 찾으러 다시 폐가에 들어갔을 때, 지하 계단에서 주웠던 거예요. 단서가 될 수 있을까요?" },
    ];

    const log = document.getElementById("chat-log");
    let i = 0;

    function showNext() {
      if (i >= messages.length) {
        document.getElementById("chat-continue").style.display = "block";
        return;
      }
      const m = messages[i++];
      const bubble = document.createElement("div");
      bubble.className = "chat-bubble " + (m.who === "me" ? "me" : "them");
      bubble.innerHTML = `<span class="chat-name">${m.name}</span>${m.text}`;
      log.appendChild(bubble);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      setTimeout(showNext, 3000);
    }

    setTimeout(showNext, 700);

    document.getElementById("continue-btn").addEventListener("click", () => {
      window.location.href = "../tempest/";
    });
  </script>
</body>
</html>
