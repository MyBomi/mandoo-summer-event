<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>만두의 여름 휴가 5</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <main class="stage">
    <span class="chapter-tag">CHAPTER 5</span>

    <p class="story">"구해줘..."</p>
    <p class="story dim">그는 알아들을 수 없는 말을 함께 중얼거렸다.</p>

  <div class="art-slot" style="min-height:160px; background-color:#f5f0e6; opacity:0.5; border-radius:8px;">
    <!-- <span class="slot-label">[ 노르브란트어로 쓰인 "The Husk" 이미지 자리 ]</span> -->
    <img src="../assets/img/quiz.png" style="width:100%; height:100%; object-fit:contain; display:block;">
  </div>

    <form class="answer-form" id="help-form">
      <div class="answer-row">
        <input type="text" id="help-input" placeholder="그가 중얼거린 단어를 입력하세요" autocomplete="off" />
        <button type="submit">전송</button>
      </div>
      <div class="error-msg" id="help-error"></div>
    </form>

    <p class="story dim" id="help-hint" style="display:none;">감정표현을 사용해보자. 단서를 얻을 수 있을지 모른다.</p>
  </main>

  <p class="brand-footer">만두의 여름 휴가 · 모그리 따끈따끈 <<만두>></p>

    <audio id="bgm" src="../assets/sound/bgm6.mp3" loop preload="auto"></audio>

  <button id="bgm-toggle" aria-label="배경음악 켜기/끄기" title="배경음악 켜기/끄기"
    style="position:fixed; right:16px; bottom:16px; z-index:999; width:44px; height:44px;
          border-radius:50%; border:none; background:rgba(20,20,30,0.75); color:#fff;
          font-size:20px; line-height:44px; text-align:center; cursor:pointer; padding:0;">🔈</button>

<script>
(function () {
  var audio = document.getElementById('bgm');
  var btn = document.getElementById('bgm-toggle');
  var userPaused = false;

  audio.volume = 0.20; // 볼륨 50% (0.0 ~ 1.0 사이로 조절 가능)

  // 아이콘은 "내가 껐다/켰다" 여부가 아니라 실제 audio 상태를 그대로 따라가게 함
  audio.addEventListener('play',  function () { btn.textContent = '🔈'; });
  audio.addEventListener('pause', function () { btn.textContent = '🔇'; });

  // 파일을 못 찾거나 재생 자체가 실패하면 콘솔에 원인을 남기고 버튼에 표시
  audio.addEventListener('error', function () {
    var code = audio.error ? audio.error.code : '?';
    console.error('[BGM] 로드/재생 실패 (code ' + code + '). src="' + audio.currentSrc + '" 경로와 파일이 실제로 있는지 확인하세요.');
    btn.textContent = '⚠️';
    btn.title = 'BGM 파일을 재생할 수 없습니다 (콘솔 확인)';
  });

  function armResumeOnInteraction() {
    var resume = function () {
      if (!userPaused) {
        audio.play().catch(function (err) { console.error('[BGM] play() 실패:', err); });
      }
      window.removeEventListener('pointerdown', resume);
      window.removeEventListener('keydown', resume);
    };
    window.addEventListener('pointerdown', resume, { once: true });
    window.addEventListener('keydown', resume, { once: true });
  }

  function tryPlay() {
    var p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function (err) {
        // 자동재생이 막힌 경우(NotAllowedError): 첫 사용자 입력 시 재생
        console.warn('[BGM] 자동재생이 막혔습니다. 화면을 한 번 클릭/터치하면 재생됩니다.', err);
        armResumeOnInteraction();
      });
    }
  }

  btn.addEventListener('click', function () {
    if (audio.paused) {
      userPaused = false;
      audio.play().catch(function (err) { console.error('[BGM] play() 실패:', err); });
    } else {
      userPaused = true;
      audio.pause();
    }
  });

  tryPlay();
})();
</script>

  <script src="../assets/answer.js"></script>
  <script>
    initAnswerForm({
      formId: "help-form",
      inputId: "help-input",
      errorId: "help-error",
      answers: ["The Husk"],
      nextUrl: "../husk/",
      failUrl: "../fail/"
    });

    setTimeout(() => {
      document.getElementById("help-hint").style.display = "block";
    }, 3 * 60 * 1000);
  </script>

  <script src="../assets/timer.js"></script>
</body>
</html>
